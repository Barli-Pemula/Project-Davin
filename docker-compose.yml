services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: artanaya
      POSTGRES_PASSWORD: artanaya_local
      POSTGRES_DB: artanaya
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - artanaya_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artanaya"]
      interval: 5s
      retries: 10
volumes:
  artanaya_data:
